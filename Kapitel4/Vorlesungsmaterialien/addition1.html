<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<!-- addition1.html -->
	<title>Addition zum Ersten</title>
</head>
<body>
	<script type='text/javascript'>
		var ersterSummand;
		var zweiterSummand;
		var summe;
		ersterSummand=9;
		zweiterSummand=10;
		summe=ersterSummand+zweiterSummand;
		document.write("Die Summe von " + ersterSummand +
				" und " + zweiterSummand +
				" ist: " + summe);
	</script>
</body>
</html>
